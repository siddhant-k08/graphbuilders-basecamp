specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Welcome
    network: base-sepolia
    source:
      address: "0x1956B43E846Fb319e12E82eCaE85F90e4fb91f56"
      abi: Welcome
      startBlock: 29920081
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - WelcomeMessageChanged
      abis:
        - name: Welcome
          file: ./abis/Welcome.json
      eventHandlers:
        - event: WelcomeMessageChanged(string)
          handler: handleWelcomeMessageChanged
      file: ./src/welcome.ts
